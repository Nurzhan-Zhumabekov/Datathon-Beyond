# Реестр типов нарушений и нормативных оснований.
# Ссылки сверяются вручную с текстом на adilet.zan.kz — модель НЕ генерирует ссылки, только выбирает id.
# Чтобы добавить правило: новый блок в violations + условие в analyze.py (detect_events).

documents:
  R231:
    title: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей (утв. постановлением Правления НБРК от 29.11.2019 № 231)"
    short: "Правила № 231 (постановление Правления НБРК от 29.11.2019 № 231)"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
  R14:
    title: "Правила организации охраны и устройства помещений банков второго уровня ... (утв. постановлением Правления НБРК от 24.02.2020 № 14)"
    short: "Правила № 14 (постановление Правления НБРК от 24.02.2020 № 14)"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"
  R48:
    title: "Требования к обеспечению информационной безопасности банков и организаций, осуществляющих отдельные виды банковских операций (утв. постановлением Правления НБРК от 27.03.2018 № 48, рег. № 16772)"
    short: "Требования к обеспечению информационной безопасности банков (постановление Правления НБРК от 27.03.2018 № 48)"
    url: "https://adilet.zan.kz/rus/docs/V1800016772"

violations:
  valuables_left:
    name: "Оставление ценностей на рабочем месте без присмотра"
    doc: R231
    clause: "п. 20 (ранее принятые наличные хранятся в закрывающихся на ключ устройствах на рабочем месте: шкаф, сейф, тележка, ящики стола, тумба)"
    explain: "Кассир покидает рабочее место, а на столе остаются предметы/ценности вне запираемого хранилища."

  unlocked_workstation:
    name: "Оставление рабочего компьютера без блокировки"
    doc: null
    clause: "источник не определён: Требования ИБ № 48 утратили силу (постановление АРРФР от 03.04.2026 № 53), а их п. 71 пп. 9 обязывал информационную систему блокировать станцию после 30 минут бездействия, а не кассира при уходе"
    explain: "Кассир покидает рабочее место, а на экране компьютера остаётся открытая рабочая программа (сеанс не заблокирован). Норма, прямо обязывающая кассира блокировать компьютер при уходе, не подтверждена; требуется проверка человеком."

  left_during_service:
    name: "Оставление рабочего места во время обслуживания клиента"
    doc: R231
    clause: "п. 22 (кассир не покидает рабочее место до окончания обслуживания клиента)"
    explain: "Кассир уходит с рабочего места, когда в помещении находится обслуживаемый посетитель."

  phone_use:
    name: "Использование мобильного телефона на рабочем месте кассира"
    doc: R231
    clause: "п. 12 (в кассовый узел допускается проносить средства связи только без функций фото- и видеофиксации; смартфон с камерой под это условие не подпадает)"
    explain: "Кассир держит в руках/использует мобильный телефон на рабочем месте. Если это телефон с камерой, по п. 12 проносить его в кассовый узел нельзя."

  personal_items:
    name: "Личные вещи на рабочем месте кассира"
    doc: R231
    clause: "п. 12 (личные вещи, деньги и ценности работников хранятся вне кассового узла)"
    explain: "На рабочем месте кассира находятся личные вещи (сумка, верхняя одежда)."

  eating_at_desk:
    name: "Приём пищи или напитков на рабочем месте кассира"
    doc: null
    clause: "источник не определён: Правила № 231 прямо не регулируют еду и напитки на рабочем месте"
    explain: "Кассир ест или пьёт на рабочем месте во время работы с ценностями. Прямая норма не найдена; требуется проверка человеком."

  collection_bag:
    name: "Нарушение порядка приёма ценностей от инкассатора"
    doc: R231
    clause: "п. 24 (при приёме сумки кассир проверяет сопроводительный документ, целостность сумки и правильность пломбы), п. 25 (при нарушении целостности сумка вскрывается в присутствии инкассатора)"
    explain: "Передача сумки/ценностей происходит без видимой проверки целостности и пломбы в присутствии передающего лица."

  cash_exposed:
    name: "Наличные открыто лежат на столе при входе посетителя"
    doc: R231
    clause: "п. 20 (ранее принятые наличные хранятся в закрывающихся на ключ устройствах; на рабочем месте находятся наличные обслуживаемого клиента)"
    explain: "В момент входа другого лица на столе видны наличные. Если это не деньги обслуживаемого клиента, ранее принятые наличные должны лежать в запираемом хранилище."

  cash_handling:
    name: "Нарушение порядка приёма/выдачи наличных"
    doc: R231
    clause: "п. 20 (приём и пересчёт наличных в присутствии клиента), п. 31 пп. 4 (пересчёт подготовленных к выдаче наличных в присутствии клиента)"
    explain: "Наличные передаются без видимого пересчёта в присутствии клиента."

  outsider_in_cash_area:
    name: "Присутствие постороннего лица в кассовом помещении"
    doc: R14
    clause: "в целом (п. 8: кассовый узел изолирован одним закрывающимся служебным входом); прямая норма о нахождении посторонних в кассовом помещении не найдена"
    explain: "Во время работы с ценностями в помещении находится дополнительное лицо помимо кассира и обслуживаемого клиента; его право находиться там по видео установить нельзя."

  other:
    name: "Иное возможное нарушение кассовой дисциплины"
    doc: null
    clause: "источник не определён"
    explain: "Модель‑эксперт зафиксировала действие, которое может нарушать порядок кассовых операций; тип и норма не определены — требуется проверка человеком."
