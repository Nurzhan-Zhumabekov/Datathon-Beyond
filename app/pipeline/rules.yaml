violations:
  valuables_left:
    name: "Оставление ценностей на рабочем месте без присмотра"
    doc: R231
    clause: "п. 20 (наличные, находящиеся в работе, хранятся на рабочем месте кассира в запираемых хранилищах)"
    explain: "Кассир покидает рабочее место, а на столе остаются предметы/ценности вне запираемого хранилища."

  unlocked_workstation:
    name: "Оставление рабочего компьютера без блокировки"
    doc: R48
    clause: "п. 71 пп. 9 (блокировка рабочей станции/ноутбука с разблокировкой только по аутентификационным данным пользователя); по данным справочных систем документ утратил силу 03.04.2026 — актуальный акт АРРФР по информационной безопасности уточняется"
    explain: "Кассир покидает рабочее место, а на экране компьютера остаётся открытая рабочая программа (сеанс не заблокирован)."

  left_during_service:
    name: "Оставление рабочего места во время обслуживания клиента"
    doc: R231
    clause: "п. 22 (кассир не покидает рабочее место до окончания обслуживания клиента)"
    explain: "Кассир уходит с рабочего места, когда в помещении находится обслуживаемый посетитель."

  phone_use:
    name: "Использование мобильного телефона на рабочем месте кассира"
    doc: R231
    clause: "п. 12 (в кассовый узел допускается проносить только средства связи без функций фото- и видеофиксации; личные вещи хранятся вне кассового узла)"
    explain: "Кассир держит в руках/использует мобильный телефон на рабочем месте."

  personal_items:
    name: "Личные вещи на рабочем месте кассира"
    doc: R231
    clause: "п. 12 (личные вещи, деньги и ценности работников хранятся вне кассового узла)"
    explain: "На рабочем месте кассира находятся личные вещи (сумка, верхняя одежда, еда или напиток)."

  collection_bag:
    name: "Нарушение порядка приёма ценностей от инкассатора"
    doc: R231
    clause: "п. 24 (при приёме сумки кассир проверяет сопроводительный документ, целостность сумки и правильность пломбы), п. 25 (при нарушении целостности сумка вскрывается в присутствии инкассатора)"
    explain: "Передача сумки/ценностей происходит без видимой проверки целостности и пломбы в присутствии передающего лица."

  cash_exposed:
    name: "Наличные открыто лежат на столе при входе посетителя"
    doc: R231
    clause: "п. 20 (наличные, находящиеся в работе, хранятся на рабочем месте кассира в запираемых хранилищах)"
    explain: "В момент входа другого лица наличные находятся на столе вне запираемого хранилища."

  cash_handling:
    name: "Нарушение порядка приёма/выдачи наличных"
    doc: R231
    clause: "п. 20 (приём и пересчёт наличных в присутствии клиента), п. 31 пп. 4 (пересчёт подготовленных к выдаче наличных в присутствии клиента)"
    explain: "Наличные передаются без видимого пересчёта в присутствии клиента."

  outsider_in_cash_area:
    name: "Присутствие постороннего лица в кассовом помещении"
    doc: R231
    clause: "п. 75 (доступ в помещение для хранения ценностей ограничен ответственными работниками); требования к охране кассовых помещений — Правила № 14"
    explain: "Во время работы с ценностями в помещении находится дополнительное лицо помимо кассира и обслуживаемого клиента."

  other:
    name: "Иное возможное нарушение кассовой дисциплины"
    doc: null
    clause: "источник не определён"
    explain: "Модель‑эксперт зафиксировала действие, которое может нарушать порядок кассовых операций; тип и норма не определены — требуется проверка человеком."
